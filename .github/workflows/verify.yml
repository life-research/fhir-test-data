name: Verify

on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  # Weekly, detects deleted or privatised packages early
  - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - name: Check out Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Lint
      run: make lint

  test:
    runs-on: ubuntu-24.04
    services:
      registry:
        image: registry:2
        ports:
        - 5000:5000
    steps:
    - name: Check out Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup ORAS
      uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      with:
        version: 1.3.6

    - name: Install Bats
      run: sudo apt-get update && sudo apt-get install -y bats

    - name: Test
      run: make test

  # Runs the action itself against fixtures pushed to a local registry.
  action:
    runs-on: ubuntu-24.04
    services:
      registry:
        image: registry:2
        ports:
        - 5000:5000
    env:
      DATASETS_DIR: ${{ github.workspace }}/test/fixtures/datasets
      BUILD_DIR: ${{ github.workspace }}/build
      REGISTRY: localhost:5000/fhir-test-data
      PLAIN_HTTP: "true"
    steps:
    - name: Check out Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup ORAS
      uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      with:
        version: 1.3.6

    - name: Publish Fixtures
      run: test/publish-fixtures.sh

    - name: Pull Chunked Fixture
      id: chunked
      uses: ./
      with:
        set: fixture-chunked
        patients: 6
        path: ${{ runner.temp }}/pulled/fixture-chunked

    - name: Pull File Fixture
      uses: ./
      with:
        set: fixture-file
        path: ${{ runner.temp }}/pulled/fixture-file

    - name: Check Pulled Fixtures
      env:
        PULLED: ${{ runner.temp }}/pulled
        DIGEST: ${{ steps.chunked.outputs.digest }}
      run: |
        scripts/verify.sh fixture-chunked "${PULLED}/fixture-chunked" 6
        scripts/verify.sh fixture-file "${PULLED}/fixture-file"
        test "$(scripts/digest.sh fixture-chunked)" = "${DIGEST}"

  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - name: Check out Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: List Published Versions
      id: matrix
      run: |
        matrix="$(scripts/matrix.sh)"
        echo "matrix=${matrix}" >>"${GITHUB_OUTPUT}"

  published:
    needs: matrix
    if: needs.matrix.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    name: published (${{ matrix.set }} ${{ matrix.version }} ${{ matrix.patients }})
    steps:
    - name: Check out Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Pull Test Data
      uses: ./
      with:
        set: ${{ matrix.set }}
        version: ${{ matrix.version }}
        patients: ${{ matrix.patients }}
        path: ${{ runner.temp }}/test-data

    - name: Verify Test Data
      env:
        SET: ${{ matrix.set }}
        PATIENTS: ${{ matrix.patients }}
      run: scripts/verify.sh "${SET}" "${RUNNER_TEMP}/test-data" "${PATIENTS}"
